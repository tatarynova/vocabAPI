<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Practice</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main>
      <header class="top">
        <h1 data-i18n="title"></h1>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="practice" data-i18n="tabPractice"></button>
        <button type="button" role="tab" data-tab="add" data-i18n="tabAdd"></button>
        <button type="button" role="tab" data-tab="stats" data-i18n="tabStats"></button>
      </nav>

      <!-- Asked once: your API key, remembered in this browser -->
      <section id="setup" class="block hidden">
        <h2 class="label" data-i18n="labelKey"></h2>
        <p data-i18n="enterKey"></p>
        <form id="keyForm">
          <input id="keyInput" type="password" autocomplete="off" data-i18n-placeholder="keyPlaceholder" />
          <button class="primary" style="margin: 12px 0 0" data-i18n="start"></button>
        </form>
      </section>

      <!-- ===================== Practice ===================== -->
      <section id="view-practice" role="tabpanel" class="hidden">
        <p id="status" class="status"></p>
        <div id="practice" class="hidden">
          <section class="block block-word">
            <h2 class="label" data-i18n="labelWord"></h2>
            <p class="word" id="word"></p>
            <p class="context" id="context"></p>
          </section>

          <button type="button" class="primary" id="revealBtn" data-i18n="showMeaning"></button>

          <div id="answer" class="hidden">
            <section class="block block-translation">
              <h2 class="label" data-i18n="labelTranslation"></h2>
              <p class="translation" id="translation" lang="ru"></p>
            </section>

            <section class="block block-definition">
              <h2 class="label" data-i18n="labelDefinition"></h2>
              <p class="meaning" id="definition"></p>
            </section>

            <section class="block block-practice">
              <h2 class="label" data-i18n="labelPractice"></h2>
              <textarea id="mySentence" rows="2" data-i18n-placeholder="sentencePlaceholder"></textarea>
              <button type="button" class="secondary" id="checkBtn" data-i18n="checkSentence"></button>
              <p class="feedback" id="feedback"></p>
            </section>

            <section class="block block-rating">
              <h2 class="label" data-i18n="labelRating"></h2>
              <div class="grades">
                <button type="button" class="g-forgot" data-grade="0" data-i18n="forgot"></button>
                <button type="button" class="g-hard" data-grade="1" data-i18n="hard"></button>
                <button type="button" class="g-good" data-grade="2" data-i18n="good"></button>
                <button type="button" class="g-easy" data-grade="3" data-i18n="easy"></button>
              </div>
            </section>
          </div>
        </div>
      </section>

      <!-- ===================== Add word ===================== -->
      <section id="view-add" role="tabpanel" class="hidden">
        <p class="status" data-i18n="addIntro"></p>
        <form id="addForm" class="block block-word" novalidate>
          <h2 class="label" data-i18n="labelNewWord"></h2>
          <label class="field">
            <span data-i18n="fieldWord"></span>
            <input id="addWord" type="text" maxlength="60" autocomplete="off" autocapitalize="none" required />
          </label>
          <label class="field">
            <span><span data-i18n="fieldContext"></span> <small data-i18n="optional"></small></span>
            <textarea id="addContext" rows="2" maxlength="1000" data-i18n-placeholder="contextPlaceholder"></textarea>
          </label>
          <label class="field">
            <span><span data-i18n="fieldDefinition"></span> <small data-i18n="optionalAuto"></small></span>
            <input id="addDefinition" type="text" maxlength="1000" autocomplete="off" />
          </label>
          <label class="field">
            <span><span data-i18n="fieldTranslation"></span> <small data-i18n="optionalAuto"></small></span>
            <input id="addTranslation" type="text" maxlength="1000" autocomplete="off" lang="ru" />
          </label>
          <label class="field">
            <span><span data-i18n="fieldSource"></span> <small data-i18n="optional"></small></span>
            <input id="addSource" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="sourcePlaceholder" />
          </label>
          <p id="addMessage" class="form-message" role="status"></p>
          <button class="primary" id="addBtn" style="margin: 0" data-i18n="saveWord"></button>
        </form>

        <section class="block block-definition">
          <h2 class="label" data-i18n="labelRecent"></h2>
          <ul id="recentList" class="recent"></ul>
        </section>
      </section>

      <!-- ===================== Progress ===================== -->
      <section id="view-stats" role="tabpanel" class="hidden">
        <div class="stats-head">
          <div class="range" role="group" data-i18n-aria="rangeLabel">
            <button type="button" data-days="7" data-i18n="range7"></button>
            <button type="button" data-days="30" data-i18n="range30"></button>
            <button type="button" data-days="90" data-i18n="range90"></button>
          </div>
        </div>
        <p id="statsStatus" class="status hidden"></p>
        <div id="statsBody">
          <div id="tiles" class="tiles"></div>

          <section class="block block-stats">
            <h2 class="label" data-i18n="chartReviews"></h2>
            <p class="chart-sub" id="reviewsSub"></p>
            <div id="chartReviews" class="chart"></div>
          </section>

          <section class="block block-stats">
            <h2 class="label" data-i18n="chartForecast"></h2>
            <p class="chart-sub" id="forecastSub"></p>
            <div id="chartForecast" class="chart"></div>
          </section>

          <section class="block block-stats">
            <h2 class="label" data-i18n="chartAdded"></h2>
            <p class="chart-sub" id="addedSub"></p>
            <div id="chartAdded" class="chart"></div>
          </section>

          <section class="block block-stats">
            <h2 class="label" data-i18n="chartCounts"></h2>
            <div id="chartCounts"></div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
